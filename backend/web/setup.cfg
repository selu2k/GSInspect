[tool:pytest]
DJANGO_SETTINGS_MODULE = web.test_settings
testpaths = api/tests
python_files = tests.py test_*.py *_tests.py
addopts = 
    --cov=api
    --cov-report=term-missing
    --cov-report=html
    -v
    --strict-markers
markers =
    django_db: mark test to use database access
    slow: mark test as slow to run

[coverage:run]
source = api
omit = 
    */migrations/*
    */tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
