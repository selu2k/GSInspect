name: CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: Run flake8
        run: |
          cd backend/web
          flake8 api --count --show-source --statistics
      
      - name: Check code formatting with black
        run: |
          cd backend/web
          black --check api

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: gsinspect_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/web
          pip install -r requirements.txt
      
      - name: Create test database
        run: |
          cd backend/web
          # Wait for MariaDB to be ready
          until mysql -h 127.0.0.1 -u root -proot_password -e "SELECT 1"; do
            sleep 1
          done
          mysql -h 127.0.0.1 -u root -proot_password -e "CREATE DATABASE IF NOT EXISTS gsinspect_test;"
      
      - name: Run migrations
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: gsinspect_test
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/web
          python manage.py migrate
      
      - name: Run pytest
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: gsinspect_test
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/web
          pytest
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/web/htmlcov/index.html
          flags: backend
          fail_ci_if_error: false

  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: gsinspect_integration
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend/web
          pip install -r requirements.txt
      
      - name: Create integration test database
        run: |
          cd backend/web
          until mysql -h 127.0.0.1 -u root -proot_password -e "SELECT 1"; do
            sleep 1
          done
          mysql -h 127.0.0.1 -u root -proot_password -e "CREATE DATABASE IF NOT EXISTS gsinspect_integration;"
      
      - name: Run migrations for integration tests
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: gsinspect_integration
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/web
          python manage.py migrate
      
      - name: Load seed data
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: gsinspect_integration
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/web
          python manage.py shell < api/fixtures/seed_data.py || echo "Seed data skipped"
      
      - name: Start Django development server
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: gsinspect_integration
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          SECRET_KEY: test-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend/web
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3
      
      - name: Run integration test script
        run: |
          pip install requests
          # Create a simple integration test
          python -c "
          import requests
          import json
          
          BASE_URL = 'http://localhost:8000/api'
          
          # Test health check
          resp = requests.get(f'{BASE_URL}/health/')
          assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
          print('✓ Health check passed')
          
          # Test filter options
          resp = requests.get(f'{BASE_URL}/public/filter-options/')
          assert resp.status_code == 200, f'Filter options failed: {resp.status_code}'
          print('✓ Filter options passed')
          
          print('✓ All integration tests passed')
          "

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend-lint.result }}" != "success" ]; then
            echo "Backend linting failed"
            exit 1
          fi
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          echo "✓ All checks passed!"
