name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env files
        run: |
          mkdir -p backend/web
          echo "${{ secrets.ENV_FILE }}" > backend/web/.env
          # Create root .env for docker-compose to know it's production
          echo "APP_ENV=prod" > .env

      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP_ADDRESS }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "."
          target: "~/gsinspect"

      - name: Deploy on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP_ADDRESS }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ~/gsinspect
            docker-compose down || true
            docker-compose up -d
            sleep 15
            # Health check from VM itself
            for i in {1..30}; do
              if curl -f http://localhost/api/health/ > /dev/null 2>&1; then
                echo "✅ App is healthy"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 2
            done
            echo "❌ App health check failed"
            exit 1

      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment successful! App is running at http://${{ secrets.VM_IP_ADDRESS }}"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed. Check logs above."
