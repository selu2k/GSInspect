name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          mkdir -p backend/web
          echo "${{ secrets.ENV_FILE }}" > backend/web/.env

      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP_ADDRESS }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "."
          target: "~/gsinspect"

      - name: Deploy on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP_ADDRESS }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ~/gsinspect
            # Create root .env from backend .env (for docker-compose)
            cp backend/web/.env .env.temp
            cat .env.temp | grep -E "^(DB_|MARIADB_|APP_ENV)" > .env
            rm .env.temp
            
            # Stop and redeploy containers (keep database volume)
            docker-compose down
            docker-compose up --build -d
            sleep 15
            # Health check from VM itself
            for i in {1..10}; do
              if curl -f http://localhost/api/health/ > /dev/null 2>&1; then
                echo "App is healthy"
                exit 0
              fi
              echo "Waiting for app... ($i/10)"
              sleep 2
            done
            echo "App health check failed"
            exit 1

      - name: Deployment Status
        if: success()
        run: echo "Deployment successful! App is running at http://${{ secrets.VM_IP_ADDRESS }}"

      - name: Deployment Failed
        if: failure()
        run: echo "Deployment failed. Check logs above."
